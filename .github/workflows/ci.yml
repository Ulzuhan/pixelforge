name: CI

# Exercises both the Next.js boundary and the real Python processor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.lock

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.u2net
          key: pixelforge-models-${{ runner.os }}-${{ hashFiles('python/requirements.lock') }}

      - run: python -m venv ~/.pixelforge-venv
      - run: ~/.pixelforge-venv/bin/pip install -r python/requirements.lock

      - run: npm ci

      - run: npm run lint

      - run: npm run build
      - run: npm test

      # Con un proveedor de mentira que FIRMA de verdad: el aviso de cierre de
      # sesión no se puede probar de otra forma.
      - run: npm run test:backchannel

      # After the build on purpose: Next generates the route types the checker
      # relies on (.next/types) during the build.
      - run: npx tsc --noEmit
