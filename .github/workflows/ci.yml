name: CI

# Exercises both the Next.js boundary and the real Python processor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/requirements.lock

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: pixelforge-models-${{ runner.os }}-${{ hashFiles('python/requirements.lock') }}

      - run: python -m venv ~/.pixelforge-venv
      - run: ~/.pixelforge-venv/bin/pip install -r python/requirements.lock

      - run: npm ci

      - run: npm run lint

      - run: npm run build
      - run: npm test

      # Con un proveedor de mentira que FIRMA de verdad: el aviso de cierre de
      # sesión no se puede probar de otra forma.
      - run: npm run test:backchannel

      # After the build on purpose: Next generates the route types the checker
      # relies on (.next/types) during the build.
      - run: npx tsc --noEmit

  container:
    name: Real runtime (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    permissions:
      contents: read
    env:
      BASE: http://127.0.0.1:3991
      PIXELFORGE_SESSION_SECRET: secreto-de-pruebas-pixelforge-32-bytes-minimo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: pixelforge-container-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/container-entrypoint.mjs') }}
      - name: Build the runtime without publishing
        run: docker build --pull -t pixelforge:ci .
      - name: Scan the runtime before running it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pixelforge:ci
          version: v0.75.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Exercise the read-only runtime and real image processing
        run: |
          npm ci
          node scripts/idp-falso.mjs 9999 /application/o/pixelforge/ > /tmp/pixelforge-idp.log 2>&1 &
          mkdir -p "$HOME/.u2net"
          sudo chown -R 10001:10001 "$HOME/.u2net"
          docker run -d --name pixelforge-ci --network host --read-only \
            --tmpfs /work:uid=10001,gid=10001,mode=700 -v "$HOME/.u2net:/models" \
            -e HOSTNAME=127.0.0.1 -e PORT=3991 -e PIXELFORGE_SESSION_SECRET \
            -e PIXELFORGE_MAX_JOBS=2 -e PIXELFORGE_MAX_QUEUE=1 \
            -e PIXELFORGE_MAX_REQUESTS_PER_HOUR=1000 \
            -e PIXELFORGE_OIDC_CLIENT_ID=pruebas -e PIXELFORGE_OIDC_CLIENT_SECRET=pruebas \
            -e PIXELFORGE_OIDC_REDIRECT_URI="$BASE/api/auth/callback" \
            -e PIXELFORGE_OIDC_ISSUER=http://127.0.0.1:9999/application/o/pixelforge/ \
            -e PIXELFORGE_OIDC_INTERNAL_BASE=http://127.0.0.1:9999 \
            -e PIXELFORGE_ENROLL_URL=https://idp.example.invalid/if/flow/enroll-pixelforge/ \
            pixelforge:ci
          for i in $(seq 1 600); do
            curl -sf "$BASE/" >/dev/null && break
            sleep 1
          done
          curl -sf "$BASE/" >/dev/null
          docker exec pixelforge-ci node --version
          docker exec pixelforge-ci /opt/venv/bin/python3 --version
          node scripts/test-auth.mjs
          node scripts/test-process.mjs
      - name: Runtime logs on failure
        if: failure()
        run: |
          docker logs pixelforge-ci || true
          cat /tmp/pixelforge-idp.log || true
      - name: Remove the test container
        if: always()
        run: |
          docker rm -fv pixelforge-ci || true
          if [ -d "$HOME/.u2net" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.u2net"
          fi
